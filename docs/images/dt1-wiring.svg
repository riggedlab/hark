<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <rect width="960" height="580" fill="#ffffff"/>
  <text x="24" y="38" font-size="22" font-weight="600" fill="#1d1d1f">Hark DT-1 接线图</text>
  <text x="24" y="62" font-size="13" fill="#6e6e73">全机只需焊两根线。焊盘位置为示意，以板子背面丝印 BAT− / BAT+ 为准。</text>

  <!-- ===== 左：板子背面 ===== -->
  <text x="40" y="104" font-size="15" font-weight="600" fill="#1d1d1f">① 板子背面（USB 口朝上）</text>
  <rect x="166" y="114" width="68" height="24" rx="8" fill="#c7c7cc" stroke="#8e8e93"/>
  <text x="200" y="131" font-size="12" text-anchor="middle" fill="#3a3a3c">USB-C</text>
  <rect x="110" y="138" width="180" height="214" rx="12" fill="#2f6b3a" stroke="#1f4a28" stroke-width="2"/>
  <text x="200" y="174" font-size="13" text-anchor="middle" fill="#e8f5e9">XIAO nRF54L15 Sense</text>
  <text x="200" y="192" font-size="12" text-anchor="middle" fill="#c8e6c9">（背面）</text>
  <text x="163" y="222" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">BAT−</text>
  <text x="237" y="222" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">BAT+</text>
  <rect x="146" y="230" width="34" height="20" rx="4" fill="#e0b84a" stroke="#8a6d1f"/>
  <rect x="220" y="230" width="34" height="20" rx="4" fill="#e0b84a" stroke="#8a6d1f"/>
  <rect x="236" y="312" width="16" height="14" rx="3" fill="#9e9e9e"/>
  <rect x="258" y="312" width="16" height="14" rx="3" fill="#9e9e9e"/>
  <text x="255" y="342" font-size="10" text-anchor="middle" fill="#e8f5e9">N1  N2</text>
  <line x1="276" y1="319" x2="318" y2="319" stroke="#d70015" stroke-width="1.5"/>
  <text x="322" y="315" font-size="12" fill="#d70015">NFC 焊盘</text>
  <text x="322" y="331" font-size="12" fill="#d70015">不要焊这里</text>
  <path d="M163 240 C163 330, 150 380, 160 424" fill="none" stroke="#1d1d1f" stroke-width="4" stroke-linecap="round"/>
  <path d="M237 240 C237 280, 210 380, 240 424" fill="none" stroke="#d70015" stroke-width="4" stroke-linecap="round"/>
  <text x="146" y="390" font-size="12" text-anchor="end" fill="#1d1d1f">黑线 → 负极</text>
  <text x="232" y="390" font-size="12" fill="#d70015">红线 → 正极</text>
  <rect x="110" y="424" width="180" height="96" rx="10" fill="#dfe3ea" stroke="#8e8e93" stroke-width="2"/>
  <rect x="140" y="418" width="120" height="12" rx="3" fill="#5ac8fa" opacity="0.6"/>
  <text x="300" y="428" font-size="11" fill="#0a84ff">← 电池自带保护板</text>
  <text x="200" y="459" font-size="15" font-weight="600" text-anchor="middle" fill="#1d1d1f">402020 锂电池</text>
  <text x="200" y="480" font-size="12" text-anchor="middle" fill="#3a3a3c">3.7V · 带保护板</text>
  <text x="200" y="499" font-size="12" text-anchor="middle" fill="#3a3a3c">约 4 × 20 × 20 mm</text>

  <!-- ===== 右：叠层侧视 ===== -->
  <text x="490" y="104" font-size="15" font-weight="600" fill="#1d1d1f">② 装进外壳后（侧面剖视）</text>
  <text x="490" y="126" font-size="12" fill="#6e6e73">左边是正面。电池贴在板子背面，中间隔一层聚酰亚胺胶带。</text>
  <!-- 外壳：上端穿绳孔，下端 USB 开口 -->
  <rect x="510" y="150" width="140" height="14" rx="4" fill="#b08a5a"/>
  <rect x="510" y="150" width="18" height="330" rx="4" fill="#b08a5a"/>
  <rect x="632" y="150" width="18" height="330" rx="4" fill="#b08a5a"/>
  <rect x="510" y="466" width="140" height="14" rx="4" fill="#b08a5a"/>
  <rect x="534" y="466" width="20" height="14" fill="#ffffff"/>
  <!-- 麦克风槽 -->
  <rect x="510" y="214" width="18" height="6" fill="#ffffff"/>
  <rect x="510" y="226" width="18" height="6" fill="#ffffff"/>
  <rect x="510" y="238" width="18" height="6" fill="#ffffff"/>
  <!-- PCB -->
  <rect x="546" y="196" width="8" height="262" fill="#2f6b3a"/>
  <rect x="534" y="218" width="12" height="22" fill="#c7c7cc"/>
  <rect x="534" y="430" width="12" height="44" fill="#9e9e9e"/>
  <!-- 胶带 -->
  <rect x="556" y="196" width="4" height="262" fill="#f5a623"/>
  <!-- 电池 -->
  <rect x="562" y="200" width="62" height="250" rx="6" fill="#dfe3ea" stroke="#8e8e93"/>
  <g font-size="12" fill="#1d1d1f" stroke-width="1">
    <line x1="580" y1="157" x2="690" y2="160" stroke="#8e8e93"/><text x="694" y="164">上端：穿绳孔</text>
    <line x1="540" y1="229" x2="690" y2="210" stroke="#8e8e93"/><text x="694" y="214">麦克风（对着面盖 3 条通槽）</text>
    <line x1="550" y1="300" x2="690" y2="260" stroke="#8e8e93"/><text x="694" y="264">PCB，正面朝外</text>
    <line x1="558" y1="340" x2="690" y2="310" stroke="#8e8e93"/><text x="694" y="314">聚酰亚胺绝缘胶带</text>
    <line x1="600" y1="380" x2="690" y2="360" stroke="#8e8e93"/><text x="694" y="364">402020 电池</text>
    <line x1="641" y1="420" x2="690" y2="410" stroke="#8e8e93"/><text x="694" y="414">底盒</text>
    <line x1="544" y1="476" x2="690" y2="460" stroke="#8e8e93"/><text x="694" y="464">下端：USB-C 开口</text>
    <line x1="519" y1="300" x2="470" y2="300" stroke="#8e8e93"/><text x="420" y="296">面盖</text>
  </g>
  <text x="40" y="552" font-size="12" fill="#d70015">⚠ 红黑线任何时候不能相碰；一次只接一根，焊点全部包好绝缘再接下一根。</text>
  <text x="490" y="520" font-size="12" fill="#d70015">装板时不要按压板子中间，只按面盖两侧卡扣的位置。</text>
  <text x="490" y="542" font-size="12" fill="#6e6e73">实测：板子加电池、包好胶带后约 20.5 × 24.5（含 USB）× 11.0 mm</text>
</svg>
