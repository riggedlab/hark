# ---- 基础 ----
CONFIG_PRINTK=y
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096

# ---- 麦克风 ----
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# ---- 蓝牙 ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Hark DT-1"
CONFIG_BT_MAX_CONN=1
# 无显示屏：LE Secure Connections Just Works，禁用 legacy pairing。
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_KEYS_OVERWRITE_OLDEST=n
# 同一手机忘记密钥后也能在按键窗口内重新配对；窗口外由 pairing_accept 拒绝。
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_USE_DT_CODE_PARTITION=y
# 大包：一次通知能带一整帧 Opus
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y

# ---- Opus 需要较大的栈和堆 ----
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_FPU=y
CONFIG_BT_BUF_EVT_RX_COUNT=12

# ---- 电池电压 ----
CONFIG_ADC=y
CONFIG_REGULATOR=y

# ---- 出错自动重启：否则一旦出错芯片就停在原地，只有断电才能恢复 ----
CONFIG_REBOOT=y
CONFIG_RESET_ON_FATAL_ERROR=y
